name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Node.js benchmark CLI
        run: |
          node --check benchmark.mjs
          node benchmark.mjs --help > /dev/null
      - name: Check Python benchmark CLI
        run: |
          python -m py_compile benchmark.py
          python benchmark.py --help > /dev/null
